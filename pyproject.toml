[project]
name = "deluge-web-client"
version = "2.1.1"
description = "Deluge Web Client"
readme = "README.md"
requires-python = ">=3.9,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jessielw" }]
keywords = [
    "python",
    "deluge",
    "api",
    "client",
    "torrent",
    "torrents",
    "webui",
    "web",
    "rpc",
    "core",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Utilities",
    "Topic :: Communications :: File Sharing",
    "Typing :: Typed",
]
dependencies = ["niquests>=3.20.1"]

[project.urls]
Homepage = "https://github.com/jessielw/deluge-web-client"
Documentation = "https://deluge-web-client.readthedocs.io"
Source = "https://github.com/jessielw/deluge-web-client"


[dependency-groups]
dev = [
    "basedpyright==1.39.9",
    "ruff==0.16.2",
    "pytest==9.1.1",
    "coverage==7.10.7; python_version < '3.10'",
    "coverage==7.15.4; python_version >= '3.10'",
    "pytest-cov==7.1.0",
    "vermin==1.8.0",
]
docs = [
    "sphinx==8.1.3",
    "sphinx-autodoc-typehints==3.0.1",
    "furo==2025.12.19",
    "Pygments==2.20.0",
]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]
branch = true
source = ["deluge_web_client"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["deluge_web_client*"]

[tool.setuptools.package-data]
deluge_web_client = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.basedpyright]
include = ["deluge_web_client", "tests"]
pythonVersion = "3.9"
typeCheckingMode = "strict"
reportPrivateUsage = false
