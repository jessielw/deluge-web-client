name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Validate lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --group dev --group docs

      - name: Run basedpyright
        run: uv run basedpyright

      - name: Verify Python compatibility
        run: uv run vermin --target=3.9- --eval-annotations deluge_web_client

      - name: Build documentation
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Build package
        run: uv build
