name: Ruff

on:
  push:
  pull_request:
  # workflow_dispatch:

jobs:
  ruff_check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run Ruff
        run: |
          uv run ruff check
          uv run ruff format --check
